<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semana 2 — Proposición y Lenguaje Simbólico | Pensamiento Crítico</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #07100f;
    --surface: #0e1a18;
    --card:    #142420;
    --border:  #1f3430;
    --accent:  #2dd4a0;
    --accent2: #f97316;
    --gold:    #fbbf24;
    --green:   #4ade80;
    --red:     #f87171;
    --text:    #e2ede9;
    --muted:   #5a7d74;
    --radius:  14px;
    --glow:    0 0 28px rgba(45,212,160,.3);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(45,212,160,.07) 0%, transparent 60%),
      radial-gradient(ellipse 50% 35% at 80% 80%, rgba(249,115,22,.05) 0%, transparent 55%);
    pointer-events: none;
  }
  #app {
    position: relative; z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* HEADER */
  .header { text-align: center; padding: 40px 0 32px; }
  .badge {
    display: inline-block;
    background: rgba(45,212,160,.12);
    border: 1px solid rgba(45,212,160,.3);
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    font-size: .7rem; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    padding: 5px 14px; border-radius: 100px; margin-bottom: 14px;
  }
  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.7rem, 5vw, 2.5rem);
    font-weight: 800; line-height: 1.15;
    background: linear-gradient(135deg, #e2ede9 20%, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 10px;
  }
  .header p { color: var(--muted); font-size: .93rem; }

  /* TABS */
  .tabs {
    display: flex; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 6px; margin-bottom: 24px;
  }
  .tab-btn {
    flex: 1; background: transparent; border: none;
    color: var(--muted); font-family: 'Syne', sans-serif;
    font-size: .82rem; font-weight: 600; padding: 10px 8px;
    border-radius: 9px; cursor: pointer; transition: all .2s; letter-spacing: .04em;
  }
  .tab-btn:hover { color: var(--text); background: var(--border); }
  .tab-btn.active { background: var(--accent); color: #07100f; box-shadow: var(--glow); }

  /* CARD */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 32px; margin-bottom: 20px;
    animation: fadeUp .4s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* FORM */
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: .78rem; font-weight: 500;
    color: var(--muted); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 7px;
  }
  .form-group input {
    width: 100%; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 9px; color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: .98rem; padding: 12px 16px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,212,160,.12); }
  .form-group input::placeholder { color: var(--muted); }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #07100f; border: none; border-radius: 9px;
    font-family: 'Syne', sans-serif; font-size: .92rem; font-weight: 700;
    padding: 13px 26px; cursor: pointer; transition: transform .15s, box-shadow .2s;
    letter-spacing: .04em;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: var(--glow); }
  .btn:active { transform: translateY(0); }
  .btn-full { width: 100%; justify-content: center; }
  .btn-outline {
    background: transparent; border: 1.5px solid var(--border);
    color: var(--muted);
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }
  .btn-gold { background: var(--gold); color: #111; }

  /* XP ROW */
  .xp-row {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 18px; padding: 12px 18px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .xp-val { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--gold); margin-left: auto; }
  .xp-label { font-size: .78rem; color: var(--muted); font-weight: 500; }

  /* STREAK */
  .streak-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .streak-star { font-size: 1.4rem; filter: grayscale(1) opacity(.3); transition: filter .4s, transform .4s; }
  .streak-star.lit { filter: none; transform: scale(1.2); }

  /* LEVEL DOTS */
  .levels-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; }
  .level-dot {
    width: 38px; height: 38px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-size: .75rem; font-weight: 700;
    color: var(--muted); transition: all .3s;
  }
  .level-dot.done { border-color: var(--green); background: rgba(74,222,128,.12); color: var(--green); }
  .level-dot.active { border-color: var(--accent); background: rgba(45,212,160,.15); color: var(--accent); box-shadow: 0 0 16px rgba(45,212,160,.35); transform: scale(1.1); }

  /* PROGRESS */
  .progress-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 100px; height: 8px; margin-bottom: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 100px; transition: width .6s cubic-bezier(.4,0,.2,1); }
  .progress-label { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: 28px; }

  /* TIMER */
  .timer-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .timer-bar-bg { flex: 1; height: 6px; background: var(--border); border-radius: 100px; overflow: hidden; }
  .timer-bar-fill { height: 100%; background: var(--gold); border-radius: 100px; transition: width .9s linear, background .3s; }
  .timer-bar-fill.danger { background: var(--red); }
  .timer-num { font-family: 'Syne', sans-serif; font-size: .88rem; font-weight: 700; color: var(--gold); min-width: 28px; text-align: right; }
  .timer-num.danger { color: var(--red); }

  /* QUESTION */
  .q-level-tag { font-family: 'Syne', sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .q-stem { font-size: 1.06rem; font-weight: 400; line-height: 1.65; margin-bottom: 22px; color: var(--text); }
  .q-stem strong { color: var(--gold); }
  .q-stem code { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-family: 'Courier New', monospace; font-size: .9em; color: var(--accent); }

  /* OPTIONS */
  .options { display: grid; gap: 10px; }
  .opt-btn {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .93rem;
    padding: 14px 18px; text-align: left; cursor: pointer; transition: all .2s;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(45,212,160,.07); transform: translateX(4px); }
  .opt-letter { min-width: 26px; height: 26px; border-radius: 6px; background: var(--border); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: .78rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
  .opt-btn.correct { border-color: var(--green); background: rgba(74,222,128,.08); cursor: default; }
  .opt-btn.correct .opt-letter { background: var(--green); color: #07100f; }
  .opt-btn.wrong { border-color: var(--red); background: rgba(248,113,113,.08); cursor: default; opacity: .7; }
  .opt-btn.wrong .opt-letter { background: var(--red); color: #fff; }
  .opt-btn:disabled { pointer-events: none; }

  /* DRAG-DROP (nivel 3 y 6) */
  .sort-list { display: grid; gap: 8px; margin-bottom: 16px; }
  .sort-item {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 10px; padding: 13px 16px; cursor: grab;
    display: flex; align-items: center; gap: 12px;
    font-size: .93rem; transition: border-color .2s, transform .15s;
    user-select: none;
  }
  .sort-item:active { cursor: grabbing; }
  .sort-item.dragging { opacity: .5; transform: scale(.97); }
  .sort-item.over { border-color: var(--accent); background: rgba(45,212,160,.08); }
  .drag-handle { color: var(--muted); font-size: 1rem; }

  /* TRUE/FALSE chips */
  .tf-row { display: flex; gap: 12px; margin-bottom: 8px; }
  .tf-chip {
    flex: 1; padding: 14px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--text); font-family: 'Syne', sans-serif;
    font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center;
    transition: all .2s; letter-spacing: .04em;
  }
  .tf-chip:hover:not(:disabled) { border-color: var(--accent); background: rgba(45,212,160,.08); }
  .tf-chip.selected-t { border-color: var(--green); background: rgba(74,222,128,.1); color: var(--green); }
  .tf-chip.selected-f { border-color: var(--red);   background: rgba(248,113,113,.08); color: var(--red); }
  .tf-chip.correct-chip { border-color: var(--green); background: rgba(74,222,128,.12); }
  .tf-chip.wrong-chip   { border-color: var(--red);   background: rgba(248,113,113,.08); opacity: .65; }
  .tf-chip:disabled { pointer-events: none; }

  /* FILL BLANK */
  .fill-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .fill-text { font-size: 1.05rem; line-height: 1.7; }
  .fill-inp {
    background: var(--surface); border-bottom: 2px solid var(--accent); border-top: none; border-left: none; border-right: none;
    border-radius: 0; color: var(--accent); font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700;
    padding: 4px 8px; outline: none; width: 140px; text-align: center;
    transition: border-color .2s;
  }
  .fill-inp:focus { border-bottom-color: var(--gold); color: var(--gold); }
  .fill-inp.ok  { border-bottom-color: var(--green); color: var(--green); }
  .fill-inp.err { border-bottom-color: var(--red);   color: var(--red); }

  /* MATCH */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .match-col-title { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; text-align: center; }
  .match-item {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 9px;
    padding: 11px 14px; font-size: .88rem; text-align: center; cursor: pointer;
    transition: all .2s; min-height: 52px; display: flex; align-items: center; justify-content: center;
  }
  .match-item:hover:not(.used):not(:disabled) { border-color: var(--accent); background: rgba(45,212,160,.07); }
  .match-item.selected { border-color: var(--gold); background: rgba(251,191,36,.08); color: var(--gold); }
  .match-item.correct-match { border-color: var(--green); background: rgba(74,222,128,.1); color: var(--green); pointer-events: none; }
  .match-item.wrong-match   { border-color: var(--red);   background: rgba(248,113,113,.08); color: var(--red); }
  .match-item.used { opacity: .35; pointer-events: none; }
  .match-score { font-family: 'Syne', sans-serif; font-size: .82rem; color: var(--muted); text-align: right; margin-top: 6px; }

  /* FEEDBACK */
  .feedback { margin-top: 16px; padding: 14px 18px; border-radius: 10px; font-size: .9rem; line-height: 1.55; display: none; animation: fadeUp .3s ease; }
  .feedback.show { display: block; }
  .feedback.ok  { background: rgba(74,222,128,.1);  border: 1px solid rgba(74,222,128,.25);  color: var(--green); }
  .feedback.err { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25); color: var(--red); }

  /* SECTION TITLE */
  .section-title { font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* RESULT */
  .result-trophy { font-size: 4rem; text-align: center; margin: 10px 0 16px; }
  .result-title { font-family: 'Syne', sans-serif; font-size: 1.7rem; font-weight: 800; text-align: center; margin-bottom: 8px; }
  .result-sub { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: .93rem; }
  .result-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 28px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 12px; text-align: center; }
  .stat-box .sv { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--accent); }
  .stat-box .sl { font-size: .75rem; color: var(--muted); margin-top: 4px; }

  .spinner { display: inline-block; width: 18px; height: 18px; border: 2.5px solid rgba(0,0,0,.2); border-top-color: #07100f; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; font-size: .88rem; z-index: 9999; animation: slideIn .3s ease; max-width: 300px; }
  .toast.ok  { border-color: var(--green); }
  .toast.err { border-color: var(--red); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

  @media (max-width: 500px) {
    .card { padding: 22px 18px; }
    .result-stats { grid-template-columns: 1fr 1fr; }
    .tab-btn { font-size: .72rem; padding: 9px 4px; }
    .match-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <div class="badge">Pensamiento Crítico · UVP · Semana 2</div>
    <h1>Proposición y<br>Lenguaje Simbólico</h1>
    <p>6 niveles · Tipos variados · Gana XP</p>
  </div>

  <!-- LOGIN -->
  <div id="screen-login" class="card">
    <div class="section-title">🎓 Identifícate</div>
    <div class="tabs" id="plantel-tabs">
      <button class="tab-btn active" data-plantel="Puebla"   onclick="selectPlantel(this)">Puebla</button>
      <button class="tab-btn"        data-plantel="Tehuacán" onclick="selectPlantel(this)">Tehuacán</button>
      <button class="tab-btn"        data-plantel="Tlaxcala" onclick="selectPlantel(this)">Tlaxcala</button>
    </div>
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" id="inp-nombre" placeholder="Ej. Luis Ramírez Torres" autocomplete="name"/>
    </div>
    <div class="form-group">
      <label>Matrícula</label>
      <input type="text" id="inp-matricula" placeholder="Ej. 2023001234"
             oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')" maxlength="12"/>
    </div>
    <button class="btn btn-full" onclick="startGame()">Comenzar actividad →</button>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="hidden">
    <div class="xp-row">
      <span style="font-size:1.3rem">⚡</span>
      <div class="xp-label">XP acumulados</div>
      <div class="xp-val" id="xp-display">0 XP</div>
    </div>
    <div class="streak-row" id="streak-row">
      <span class="streak-star" id="st0">⭐</span><span class="streak-star" id="st1">⭐</span>
      <span class="streak-star" id="st2">⭐</span><span class="streak-star" id="st3">⭐</span>
      <span class="streak-star" id="st4">⭐</span><span class="streak-star" id="st5">⭐</span>
    </div>
    <div class="levels-row" id="levels-row"></div>
    <div class="progress-wrap"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="progress-label"><span id="prog-label">Nivel 1 de 6</span><span id="prog-pct">0%</span></div>

    <div class="card" id="q-card">
      <div class="timer-wrap">
        <div class="timer-bar-bg"><div class="timer-bar-fill" id="timer-bar" style="width:100%"></div></div>
        <div class="timer-num" id="timer-num">30</div>
      </div>
      <div class="q-level-tag" id="q-level-tag">Nivel 1</div>
      <div id="q-body"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn btn-full hidden" id="btn-next" onclick="nextQuestion()" style="margin-top:18px">Siguiente nivel →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="hidden card">
    <div class="result-trophy" id="result-trophy">🏆</div>
    <div class="result-title"  id="result-title">¡Actividad completada!</div>
    <div class="result-sub"    id="result-sub"></div>
    <div class="result-stats">
      <div class="stat-box"><div class="sv" id="r-correct">0</div><div class="sl">Correctas</div></div>
      <div class="stat-box"><div class="sv" id="r-xp">0</div><div class="sl">XP ganados</div></div>
      <div class="stat-box"><div class="sv" id="r-time">0s</div><div class="sl">Tiempo</div></div>
    </div>
    <button class="btn btn-full btn-gold" id="btn-save" onclick="saveResult()">
      <span id="save-label">Guardar resultado</span>
    </button>
    <div style="height:10px"></div>
    <button class="btn btn-full btn-outline" onclick="resetAll()">Reintentar actividad</button>
  </div>

</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHrcAlYOVJ66BjFZygT6d2pG8kWdWjRsSSl06ESe3_qa4__yf1e98CVGor0cip2Yql/exec";

// ════════════════════════════════════════════════════════════
// LEVELS — 6 mecánicas distintas
// ════════════════════════════════════════════════════════════
const LEVELS = [

  // ── Nivel 1: Opción múltiple ──────────────────────────────
  {
    id: 1, tag: "Nivel 1 — Reconocimiento", xp: 50, time: 30, type: "mcq",
    stem: "¿Cuál de los siguientes enunciados <strong>SÍ es una proposición lógica</strong>?",
    opts: [
      "¿Cuántas manzanas hay en la canasta?",
      "La Ciudad de México es la capital de México.",
      "¡Cierra la puerta!",
      "Ojalá que mañana no llueva."
    ],
    correct: 1,
    fb_ok: "✅ Correcto. Una proposición es un enunciado declarativo que puede ser verdadero o falso. «La CDMX es la capital» tiene valor de verdad.",
    fb_err: "Solo los enunciados declarativos (afirmaciones o negaciones) son proposiciones. Preguntas, órdenes y deseos no lo son."
  },

  // ── Nivel 2: Verdadero / Falso ────────────────────────────
  {
    id: 2, tag: "Nivel 2 — Verdadero o Falso", xp: 75, time: 25, type: "tf",
    stem: "En lógica proposicional, a cada variable como <code>p</code> o <code>q</code> se le llama <strong>átomo lógico</strong> porque representa la unidad mínima indivisible de una proposición.",
    correct: true,
    fb_ok: "✅ Verdadero. Los átomos lógicos (p, q, r…) son las unidades básicas; no se descomponen más dentro del sistema proposicional.",
    fb_err: "Es Verdadero. Los átomos lógicos son exactamente eso: la unidad mínima. Al combinarlos con conectivas se forman proposiciones compuestas."
  },

  // ── Nivel 3: Clasifica arrastrando ───────────────────────
  {
    id: 3, tag: "Nivel 3 — Clasifica", xp: 100, time: 35, type: "classify",
    stem: "Arrastra (o haz clic) cada enunciado a su categoría correcta: <strong>Proposición</strong> o <strong>No proposición</strong>.",
    items: [
      { text: "El sol es una estrella.", cat: "P" },
      { text: "¿Estudias hoy?",          cat: "N" },
      { text: "Dos más dos es cuatro.",   cat: "P" },
      { text: "¡Silencio en el aula!",   cat: "N" },
    ],
    fb_ok: "✅ ¡Clasificación perfecta! Recuerda: sólo los enunciados con valor de verdad definido son proposiciones.",
    fb_err: "Revisa: preguntas e imperativos no tienen valor de verdad, así que no son proposiciones."
  },

  // ── Nivel 4: Completar el espacio ─────────────────────────
  {
    id: 4, tag: "Nivel 4 — Completa", xp: 125, time: 30, type: "fill",
    before: "Si la variable proposicional ",
    blank: "p",
    after: " representa «Hoy llueve», entonces la negación de esa proposición se escribe como",
    blank2: "¬p",
    after2: " y se lee «No es cierto que hoy llueva».",
    hint: "Letra minúscula para la variable, símbolo de negación para la segunda.",
    answers: ["p", "¬p"],
    fb_ok: "✅ Correcto. <code>p</code> es el átomo; <code>¬p</code> es su negación (también válido escribir ~p).",
    fb_err: "La variable es una letra minúscula como <code>p</code>. Su negación se expresa con el símbolo <code>¬</code> delante."
  },

  // ── Nivel 5: Empareja ─────────────────────────────────────
  {
    id: 5, tag: "Nivel 5 — Empareja", xp: 150, time: 35, type: "match",
    stem: "Empareja cada <strong>enunciado natural</strong> con su <strong>formalización correcta</strong>.",
    pairs: [
      { left: "Hoy es lunes.",              right: "p" },
      { left: "No es lunes.",               right: "¬p" },
      { left: "Hoy llueve y es lunes.",     right: "q ∧ p" },
      { left: "Hoy llueve o es lunes.",     right: "q ∨ p" },
    ],
    fb_ok: "✅ ¡Emparejamiento perfecto! Dominas la representación simbólica de proposiciones simples y compuestas.",
    fb_err: "Recuerda: ∧ = 'y' (conjunción), ∨ = 'o' (disyunción), ¬ = 'no' (negación)."
  },

  // ── Nivel 6: Opción múltiple avanzada ─────────────────────
  {
    id: 6, tag: "Nivel 6 — Análisis", xp: 200, time: 25, type: "mcq",
    stem: "Un estudiante escribe: <em>«Si <code>p</code> = 'Apruebo el examen' y <code>q</code> = 'Festejo', entonces la proposición 'Si apruebo el examen, entonces festejo' se representa como <code>q → p</code>.»</em><br><br>¿Es correcta su formalización?",
    opts: [
      "Sí, porque p y q son intercambiables en cualquier condicional.",
      "No. La forma correcta es <code>p → q</code>, porque p es el antecedente y q el consecuente.",
      "Sí, el orden del condicional no importa en lógica proposicional.",
      "No. Debería escribirse <code>p ∧ q</code> porque implica ambas proposiciones."
    ],
    correct: 1,
    fb_ok: "✅ Excelente análisis. En un condicional <code>p → q</code>, <em>p</em> es el antecedente (causa/condición) y <em>q</em> el consecuente (efecto/resultado). Invertirlos cambia por completo el significado.",
    fb_err: "El condicional NO es conmutativo. «Si p entonces q» se escribe <code>p → q</code>. Intercambiar antecedente y consecuente produce una proposición completamente diferente."
  }
];

// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
let state = {
  plantel:"Puebla", nombre:"", matricula:"",
  current:0, xp:0, correct:0, startTime:null,
  timer:null, timeLeft:30, answered:false, _totalTime:0,
  classifyScore:0, matchScore:0, matchSel:null, matchPairs:[]
};

// ════════════════════════════════════════════════════════════
// PLANTEL
// ════════════════════════════════════════════════════════════
function selectPlantel(btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.plantel = btn.dataset.plantel;
}

// ════════════════════════════════════════════════════════════
// START
// ════════════════════════════════════════════════════════════
function startGame() {
  const nombre    = document.getElementById('inp-nombre').value.trim();
  const matricula = document.getElementById('inp-matricula').value.trim();
  if (!nombre)             { showToast("Escribe tu nombre completo","err"); return; }
  if (matricula.length<5)  { showToast("Matrícula inválida (mín. 5 caracteres)","err"); return; }
  state.nombre=nombre; state.matricula=matricula;
  state.current=0; state.xp=0; state.correct=0;
  state.startTime=Date.now();
  show('screen-game'); hide('screen-login');
  buildDots(); loadLevel();
}

function buildDots() {
  const row=document.getElementById('levels-row'); row.innerHTML='';
  LEVELS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='level-dot'+(i===0?' active':''); d.id='dot-'+i; d.textContent=i+1; row.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
// LOAD LEVEL
// ════════════════════════════════════════════════════════════
function loadLevel() {
  const lvl=LEVELS[state.current];
  state.answered=false; state.classifyScore=0; state.matchScore=0;
  state.matchSel=null; state.matchPairs=[];

  // dots
  document.querySelectorAll('.level-dot').forEach((d,i)=>{
    d.className='level-dot'+(i<state.current?' done':'')+(i===state.current?' active':'');
    d.textContent=i<state.current?'✓':i+1;
  });
  // progress
  const pct=Math.round((state.current/LEVELS.length)*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=`Nivel ${state.current+1} de ${LEVELS.length}`;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('q-level-tag').textContent=lvl.tag;

  // feedback + next
  const fb=document.getElementById('feedback');
  fb.className='feedback'; fb.innerHTML='';
  document.getElementById('btn-next').classList.add('hidden');

  // render body
  const body=document.getElementById('q-body');
  body.innerHTML='';
  switch(lvl.type) {
    case 'mcq':      renderMCQ(lvl,body);      break;
    case 'tf':       renderTF(lvl,body);       break;
    case 'classify': renderClassify(lvl,body); break;
    case 'fill':     renderFill(lvl,body);     break;
    case 'match':    renderMatch(lvl,body);    break;
  }

  startTimer(lvl.time);
}

// ════════════════════════════════════════════════════════════
// RENDER TYPES
// ════════════════════════════════════════════════════════════
function renderMCQ(lvl,body) {
  body.innerHTML=`<div class="q-stem">${lvl.stem}</div><div class="options" id="options"></div>`;
  const opts=body.querySelector('#options');
  const letters=['A','B','C','D'];
  lvl.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt-btn';
    b.innerHTML=`<span class="opt-letter">${letters[i]}</span><span>${o}</span>`;
    b.onclick=()=>answerMCQ(i,lvl);
    opts.appendChild(b);
  });
}

function answerMCQ(idx,lvl) {
  if(state.answered) return;
  state.answered=true;
  clearInterval(state.timer);
  const ok=idx===lvl.correct;
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===lvl.correct) b.classList.add('correct');
    else if(i===idx&&!ok) b.classList.add('wrong');
  });
  if(ok) { earnXP(lvl); }
  else { showFeedback(false,lvl.fb_err); }
  document.getElementById('btn-next').classList.remove('hidden');
}

function renderTF(lvl,body) {
  body.innerHTML=`
    <div class="q-stem">${lvl.stem}</div>
    <div class="tf-row">
      <button class="tf-chip" id="chip-t" onclick="answerTF(true,this)">✓ Verdadero</button>
      <button class="tf-chip" id="chip-f" onclick="answerTF(false,this)">✗ Falso</button>
    </div>`;
}

function answerTF(val,btn) {
  if(state.answered) return;
  state.answered=true;
  clearInterval(state.timer);
  const lvl=LEVELS[state.current];
  const ok=val===lvl.correct;
  document.getElementById('chip-t').disabled=true;
  document.getElementById('chip-f').disabled=true;
  btn.classList.add(val?'selected-t':'selected-f');
  if(ok) { btn.classList.add('correct-chip'); earnXP(lvl); }
  else   { btn.classList.add('wrong-chip'); showFeedback(false,lvl.fb_err); }
  document.getElementById('btn-next').classList.remove('hidden');
}

function renderClassify(lvl,body) {
  body.innerHTML=`<div class="q-stem">${lvl.stem}</div>
  <div id="classify-area" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:6px">
    <div>
      <div class="match-col-title">📗 Proposición</div>
      <div id="drop-P" class="sort-list" style="min-height:56px;background:var(--surface);border:1.5px dashed var(--border);border-radius:10px;padding:8px"></div>
    </div>
    <div>
      <div class="match-col-title">📕 No proposición</div>
      <div id="drop-N" class="sort-list" style="min-height:56px;background:var(--surface);border:1.5px dashed var(--border);border-radius:10px;padding:8px"></div>
    </div>
  </div>
  <div id="items-pool" class="sort-list"></div>
  <button class="btn btn-full" id="btn-check-classify" onclick="checkClassify()" style="margin-top:12px">Verificar clasificación ✓</button>`;

  const pool=body.querySelector('#items-pool');
  lvl.items.forEach((item,i)=>{
    const d=document.createElement('div');
    d.className='sort-item'; d.dataset.idx=i; d.dataset.cat=item.cat;
    d.innerHTML=`<span class="drag-handle">⠿</span>${item.text}`;
    d.draggable=true;
    d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text',i); d.classList.add('dragging');});
    d.addEventListener('dragend',()=>d.classList.remove('dragging'));
    d.onclick=()=>moveToNext(d);
    pool.appendChild(d);
  });
  ['drop-P','drop-N','items-pool'].forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave',()=>el.classList.remove('over'));
    el.addEventListener('drop',e=>{ e.preventDefault(); el.classList.remove('over'); const idx=e.dataTransfer.getData('text'); el.appendChild(document.querySelector(`[data-idx="${idx}"]`)); });
  });
}

function moveToNext(el) {
  const cur=el.parentElement.id;
  const targets=['items-pool','drop-P','drop-N'];
  const next=targets[(targets.indexOf(cur)+1)%3];
  document.getElementById(next).appendChild(el);
}

function checkClassify() {
  if(state.answered) return;
  const lvl=LEVELS[state.current];
  let score=0;
  lvl.items.forEach(item=>{
    const el=document.querySelector(`[data-idx="${lvl.items.indexOf(item)}"]`);
    const isCorrect= el && el.parentElement.id==='drop-'+item.cat;
    if(isCorrect) { el.style.borderColor='var(--green)'; el.style.background='rgba(74,222,128,.1)'; score++; }
    else if(el)   { el.style.borderColor='var(--red)';   el.style.background='rgba(248,113,113,.08)'; }
  });
  state.answered=true;
  clearInterval(state.timer);
  document.getElementById('btn-check-classify').disabled=true;
  const ok=score===lvl.items.length;
  if(ok) earnXP(lvl);
  else   showFeedback(false,lvl.fb_err);
  document.getElementById('btn-next').classList.remove('hidden');
}

function renderFill(lvl,body) {
  body.innerHTML=`
    <div class="q-stem" style="margin-bottom:16px">Completa los espacios con los símbolos correctos:</div>
    <div class="fill-wrap" style="font-size:1rem;line-height:2.2;flex-wrap:wrap;gap:6px">
      <span>${lvl.before}</span>
      <input class="fill-inp" id="fill1" maxlength="3" placeholder="?" autocomplete="off" spellcheck="false"/>
      <span>${lvl.after}</span>
      <input class="fill-inp" id="fill2" maxlength="3" placeholder="?" autocomplete="off" spellcheck="false"/>
      <span>${lvl.after2}</span>
    </div>
    <p style="font-size:.78rem;color:var(--muted);margin-top:8px">💡 ${lvl.hint}</p>
    <button class="btn btn-full" id="btn-check-fill" onclick="checkFill()" style="margin-top:14px">Verificar →</button>`;
}

function checkFill() {
  if(state.answered) return;
  const lvl=LEVELS[state.current];
  const v1=document.getElementById('fill1').value.trim();
  const v2=document.getElementById('fill2').value.trim();
  const ok1=v1===lvl.answers[0]||v1.toLowerCase()===lvl.answers[0].toLowerCase();
  const ok2=v2===lvl.answers[1]||v2==='~p';
  const ok=ok1&&ok2;
  state.answered=true; clearInterval(state.timer);
  document.getElementById('fill1').className='fill-inp '+(ok1?'ok':'err');
  document.getElementById('fill2').className='fill-inp '+(ok2?'ok':'err');
  document.getElementById('btn-check-fill').disabled=true;
  if(ok) earnXP(lvl);
  else   showFeedback(false,lvl.fb_err);
  document.getElementById('btn-next').classList.remove('hidden');
}

function renderMatch(lvl,body) {
  // shuffle rights
  const rights=[...lvl.pairs.map(p=>p.right)].sort(()=>Math.random()-.5);
  body.innerHTML=`<div class="q-stem">${lvl.stem}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div>
      <div class="match-col-title">Enunciado</div>
      <div id="lefts" style="display:grid;gap:8px"></div>
    </div>
    <div>
      <div class="match-col-title">Símbolo</div>
      <div id="rights" style="display:grid;gap:8px"></div>
    </div>
  </div>
  <div class="match-score" id="match-score">0 / ${lvl.pairs.length} emparejados</div>`;

  const leftsEl=body.querySelector('#lefts');
  lvl.pairs.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='match-item'; d.dataset.li=i; d.textContent=p.left;
    d.onclick=()=>matchSelectLeft(d,i);
    leftsEl.appendChild(d);
  });
  const rightsEl=body.querySelector('#rights');
  rights.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='match-item'; d.dataset.ri=i; d.dataset.val=r;
    d.textContent=r;
    d.onclick=()=>matchSelectRight(d);
    rightsEl.appendChild(d);
  });
}

function matchSelectLeft(el,idx) {
  if(el.classList.contains('correct-match')||state.answered) return;
  document.querySelectorAll('.match-item[data-li]').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  state.matchSel={type:'left',idx,el};
  if(state.matchSel&&state.matchSel.rEl) tryMatch();
}

function matchSelectRight(el) {
  if(el.classList.contains('correct-match')||el.classList.contains('used')||state.answered) return;
  if(!state.matchSel) { el.classList.add('selected'); state.matchSel={type:'right',rEl:el}; return; }
  if(state.matchSel.type==='right') {
    document.querySelectorAll('.match-item[data-ri]').forEach(b=>b.classList.remove('selected'));
    el.classList.add('selected');
    state.matchSel.rEl=el;
    return;
  }
  state.matchSel.rEl=el;
  tryMatch();
}

function tryMatch() {
  const {idx,el,rEl}=state.matchSel;
  if(!el||!rEl) return;
  const lvl=LEVELS[state.current];
  const correct=lvl.pairs[idx].right;
  if(rEl.dataset.val===correct) {
    el.classList.add('correct-match'); rEl.classList.add('correct-match');
    state.matchPairs.push(idx);
    const sc=state.matchPairs.length;
    document.getElementById('match-score').textContent=`${sc} / ${lvl.pairs.length} emparejados`;
    if(sc===lvl.pairs.length) {
      clearInterval(state.timer); state.answered=true; earnXP(lvl);
      document.getElementById('btn-next').classList.remove('hidden');
    }
  } else {
    el.classList.add('wrong-match'); rEl.classList.add('wrong-match');
    setTimeout(()=>{ el.classList.remove('wrong-match','selected'); rEl.classList.remove('wrong-match','selected'); },700);
  }
  state.matchSel=null;
}

// ════════════════════════════════════════════════════════════
// TIMER
// ════════════════════════════════════════════════════════════
function startTimer(seconds) {
  clearInterval(state.timer); state.timeLeft=seconds;
  const bar=document.getElementById('timer-bar'), num=document.getElementById('timer-num');
  bar.className='timer-bar-fill'; num.className='timer-num';
  bar.style.width='100%'; num.textContent=seconds;
  state.timer=setInterval(()=>{
    state.timeLeft--;
    const pct=(state.timeLeft/seconds)*100;
    bar.style.width=pct+'%'; num.textContent=state.timeLeft;
    if(state.timeLeft<=8){ bar.className='timer-bar-fill danger'; num.className='timer-num danger'; }
    if(state.timeLeft<=0){ clearInterval(state.timer); if(!state.answered) timeOut(); }
  },1000);
}

function timeOut() {
  if(state.answered) return;
  state.answered=true;
  const lvl=LEVELS[state.current];
  ['btn-check-classify','btn-check-fill'].forEach(id=>{ const el=document.getElementById(id); if(el) el.disabled=true; });
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{ b.disabled=true; if(i===lvl.correct) b.classList.add('correct'); });
  showFeedback(false,'⏱ ¡Tiempo agotado! '+lvl.fb_err);
  document.getElementById('btn-next').classList.remove('hidden');
}

// ════════════════════════════════════════════════════════════
// XP + FEEDBACK
// ════════════════════════════════════════════════════════════
function earnXP(lvl) {
  const timeBonus=Math.round((state.timeLeft/lvl.time)*50);
  state.xp+=lvl.xp+timeBonus; state.correct+=1;
  document.getElementById('st'+state.current).classList.add('lit');
  document.getElementById('xp-display').textContent=state.xp+' XP';
  showFeedback(true,lvl.fb_ok+(timeBonus?` <em>+${timeBonus} XP por rapidez 🚀</em>`:''));
}

function showFeedback(ok,msg) {
  const fb=document.getElementById('feedback');
  fb.className='feedback show '+(ok?'ok':'err');
  fb.innerHTML=msg;
}

// ════════════════════════════════════════════════════════════
// NEXT / RESULT
// ════════════════════════════════════════════════════════════
function nextQuestion() {
  state.current++;
  if(state.current>=LEVELS.length) showResult();
  else loadLevel();
}

function showResult() {
  hide('screen-game'); show('screen-result');
  const totalTime=Math.round((Date.now()-state.startTime)/1000);
  state._totalTime=totalTime;
  const pct=Math.round((state.correct/LEVELS.length)*100);
  let trophy='🥉',title='¡Actividad completada!',sub='Repasa los temas y vuelve a intentar.';
  if(pct>=83){trophy='🏆';title='¡Dominio excelente!';sub='Estás listo para la Semana 3.';}
  else if(pct>=60){trophy='🥈';title='¡Buen trabajo!';sub='Repasa los simbolismos que fallaste.';}
  document.getElementById('result-trophy').textContent=trophy;
  document.getElementById('result-title').textContent=title;
  document.getElementById('result-sub').textContent=sub;
  document.getElementById('r-correct').textContent=`${state.correct}/6`;
  document.getElementById('r-xp').textContent=state.xp;
  document.getElementById('r-time').textContent=totalTime+'s';
}

// ════════════════════════════════════════════════════════════
// SAVE
// ════════════════════════════════════════════════════════════
async function saveResult() {
  const btn=document.getElementById('btn-save'), lbl=document.getElementById('save-label');
  btn.disabled=true; lbl.innerHTML='<span class="spinner"></span> Guardando...';
  const payload={
    plantel:state.plantel, matricula:state.matricula, nombre:state.nombre,
    semana:2, tema:"Proposición y Lenguaje Simbólico",
    correctas:state.correct, total:LEVELS.length,
    xp:state.xp, porcentaje:Math.round((state.correct/LEVELS.length)*100),
    tiempoTotal:state._totalTime,
    fecha:new Date().toLocaleString('es-MX',{timeZone:'America/Mexico_City'})
  };
  try {
    await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    showToast('✅ Resultado guardado','ok'); lbl.textContent='✓ Guardado';
  } catch(e) {
    showToast('❌ Error al guardar','err'); btn.disabled=false; lbl.textContent='Reintentar';
  }
}

// ════════════════════════════════════════════════════════════
// RESET + UTILS
// ════════════════════════════════════════════════════════════
function resetAll() {
  hide('screen-result'); hide('screen-game'); show('screen-login');
  for(let i=0;i<6;i++) document.getElementById('st'+i).classList.remove('lit');
  document.getElementById('xp-display').textContent='0 XP';
}
function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }
function showToast(msg,type){
  const t=document.createElement('div'); t.className='toast '+type; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3500);
}
</script>
</body>
</html>
