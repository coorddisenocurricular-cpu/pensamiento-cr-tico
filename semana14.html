<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semana 14 — Árboles de Decisión | Pensamiento Crítico</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060d0a;--surface:#0c1a14;--card:#11241a;--border:#1a3828;
    --a1:#10b981;--a2:#34d399;--a3:#6ee7b7;--gold:#f59e0b;
    --red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;
    --text:#d1fae5;--muted:#1f4d35;--radius:14px;
    --glow:0 0 28px rgba(16,185,129,.25);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;z-index:0;
    background:radial-gradient(ellipse 70% 55% at 50% -5%,rgba(16,185,129,.09) 0%,transparent 55%),
               radial-gradient(ellipse 45% 35% at 90% 85%,rgba(245,158,11,.05) 0%,transparent 50%);
    pointer-events:none}
  #app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:24px 16px 60px}

  .header{text-align:center;padding:36px 0 24px}
  .badge{display:inline-block;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:var(--a1);font-family:'Fira Mono',monospace;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;padding:5px 14px;border-radius:100px;margin-bottom:14px}
  .header h1{font-size:clamp(1.9rem,5.5vw,2.8rem);font-weight:800;line-height:1.1;margin-bottom:10px;
    background:linear-gradient(135deg,#fff 10%,var(--a1) 50%,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .header p{color:var(--muted);font-size:.9rem}

  /* tree diagram */
  .tree-preview{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:26px;overflow-x:auto}
  .tree-svg-wrap{min-width:340px;display:flex;justify-content:center}
  .tree-preview svg text{font-family:'Fira Mono',monospace;font-size:11px;fill:#d1fae5}
  .tree-preview svg .node-dec{fill:#1a3828;stroke:#10b981;stroke-width:1.5}
  .tree-preview svg .node-cha{fill:#1a2038;stroke:#3b82f6;stroke-width:1.5}
  .tree-preview svg .node-end{fill:#2d1a38;stroke:#8b5cf6;stroke-width:1.5}
  .tree-preview svg line{stroke:#1a3828;stroke-width:1.5}
  .tree-preview svg .branch-lbl{fill:#6b7280;font-size:9px}
  .legend-row{display:flex;gap:16px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
  .legend-box{width:14px;height:14px;border-radius:3px;border:1.5px solid}

  .tabs{display:flex;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px;margin-bottom:24px}
  .tab-btn{flex:1;background:transparent;border:none;color:var(--muted);font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:700;padding:10px 8px;border-radius:9px;cursor:pointer;transition:all .2s}
  .tab-btn:hover{color:var(--text);background:var(--border)}
  .tab-btn.active{background:var(--a1);color:#060d0a;box-shadow:var(--glow)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;margin-bottom:20px;animation:fadeUp .4s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .form-group{margin-bottom:18px}
  .form-group label{display:block;font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
  .form-group input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-family:'Nunito',sans-serif;font-size:.98rem;padding:12px 16px;outline:none;transition:border-color .2s,box-shadow .2s}
  .form-group input:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(16,185,129,.1)}
  .form-group input::placeholder{color:var(--muted)}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--a1);color:#060d0a;border:none;border-radius:9px;font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:800;padding:13px 26px;cursor:pointer;transition:transform .15s,box-shadow .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:var(--glow)}
  .btn:active{transform:translateY(0)}
  .btn-full{width:100%;justify-content:center}
  .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--muted)}
  .btn-outline:hover{border-color:var(--a1);color:var(--a1);box-shadow:none}
  .btn-gold{background:var(--gold);color:#060d0a}
  .btn-blue{background:var(--blue);color:#fff}
  .xp-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:12px 18px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
  .xp-val{font-family:'Fira Mono',monospace;font-size:1.1rem;color:var(--gold);margin-left:auto}
  .xp-label{font-size:.78rem;color:var(--muted)}
  .streak-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .streak-star{font-size:1.4rem;filter:grayscale(1) opacity(.3);transition:filter .4s,transform .4s}
  .streak-star.lit{filter:none;transform:scale(1.2)}
  .levels-row{display:flex;gap:10px;justify-content:center;margin-bottom:28px}
  .level-dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:'Fira Mono',monospace;font-size:.75rem;color:var(--muted);transition:all .3s}
  .level-dot.done{border-color:var(--a1);background:rgba(16,185,129,.1);color:var(--a1)}
  .level-dot.active{border-color:var(--gold);background:rgba(245,158,11,.1);color:var(--gold);box-shadow:0 0 16px rgba(245,158,11,.3);transform:scale(1.1)}
  .progress-wrap{background:var(--surface);border:1px solid var(--border);border-radius:100px;height:8px;margin-bottom:10px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--a1),var(--gold));border-radius:100px;transition:width .6s cubic-bezier(.4,0,.2,1)}
  .progress-label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-bottom:28px}
  .timer-wrap{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .timer-bar-bg{flex:1;height:6px;background:var(--border);border-radius:100px;overflow:hidden}
  .timer-bar-fill{height:100%;background:var(--a1);border-radius:100px;transition:width .9s linear,background .3s}
  .timer-bar-fill.danger{background:var(--red)}
  .timer-num{font-family:'Fira Mono',monospace;font-size:.88rem;color:var(--a1);min-width:28px;text-align:right}
  .timer-num.danger{color:var(--red)}
  .q-tag{font-family:'Fira Mono',monospace;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--a1);margin-bottom:10px}
  .q-stem{font-size:1rem;font-weight:600;line-height:1.72;margin-bottom:22px}
  .q-stem strong{color:var(--gold)}
  .q-stem em{color:var(--a2);font-style:italic}
  .mono{font-family:'Fira Mono',monospace;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-size:.88em;color:var(--a1)}
  .options{display:grid;gap:10px}
  .opt-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'Nunito',sans-serif;font-size:.92rem;padding:13px 16px;text-align:left;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:12px}
  .opt-btn:hover:not(:disabled){border-color:var(--a1);background:rgba(16,185,129,.06);transform:translateX(4px)}
  .opt-letter{min-width:26px;height:26px;border-radius:6px;background:var(--border);display:flex;align-items:center;justify-content:center;font-family:'Fira Mono',monospace;font-size:.75rem;color:var(--muted);flex-shrink:0}
  .opt-btn.correct{border-color:var(--a1);background:rgba(16,185,129,.07)}
  .opt-btn.correct .opt-letter{background:var(--a1);color:#060d0a}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,.07);opacity:.7}
  .opt-btn.wrong .opt-letter{background:var(--red);color:#fff}
  .opt-btn:disabled{pointer-events:none}
  .tf-row{display:flex;gap:12px}
  .tf-chip{flex:1;padding:16px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;transition:all .2s}
  .tf-chip:hover:not(:disabled){border-color:var(--a1);background:rgba(16,185,129,.07)}
  .tf-chip.correct-chip{border-color:var(--a1);background:rgba(16,185,129,.1);color:var(--a1)}
  .tf-chip.wrong-chip{border-color:var(--red);background:rgba(239,68,68,.07);opacity:.65}
  .tf-chip:disabled{pointer-events:none}
  /* TREE NODE PICKER */
  .tree-case{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:10px;padding:16px 18px;margin-bottom:16px;font-size:.92rem;line-height:1.7}
  .tree-case strong{color:var(--gold)}
  .tree-q{font-size:.92rem;font-weight:700;margin-bottom:12px;color:var(--text)}
  .node-choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .nc-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:9px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s;font-size:.82rem;font-weight:700}
  .nc-btn.dec{border-color:#10b981;color:#10b981} .nc-btn.dec:hover:not(:disabled){background:rgba(16,185,129,.1)}
  .nc-btn.cha{border-color:#3b82f6;color:#3b82f6} .nc-btn.cha:hover:not(:disabled){background:rgba(59,130,246,.1)}
  .nc-btn.end{border-color:#8b5cf6;color:#8b5cf6} .nc-btn.end:hover:not(:disabled){background:rgba(139,92,246,.1)}
  .nc-btn.correct-nc{background:rgba(16,185,129,.12)!important;border-color:var(--a1)!important}
  .nc-btn.wrong-nc{opacity:.5;background:rgba(239,68,68,.07)!important}
  .nc-btn:disabled{pointer-events:none}
  /* EV calculator */
  .ev-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:14px;font-family:'Fira Mono',monospace;font-size:.88rem}
  .ev-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
  .ev-row:last-child{border-bottom:none;font-weight:700;color:var(--gold)}
  .ev-label{flex:1;color:var(--muted)}
  .ev-val{color:var(--text);min-width:80px;text-align:right}
  .ev-result{color:var(--gold)}
  /* DRAG */
  .sort-list{display:grid;gap:8px;margin-bottom:14px}
  .sort-item{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:13px 16px;cursor:grab;display:flex;align-items:flex-start;gap:12px;font-size:.9rem;line-height:1.5;transition:all .2s;user-select:none}
  .sort-item:active{cursor:grabbing}
  .sort-item.dragging{opacity:.45;transform:scale(.97)}
  .sort-item.drag-over{border-color:var(--a1);background:rgba(16,185,129,.07)}
  .drag-handle{color:var(--muted);font-size:1rem;flex-shrink:0;margin-top:2px}
  .step-num{font-family:'Fira Mono',monospace;font-size:.72rem;color:var(--a1);min-width:22px;flex-shrink:0;margin-top:2px}
  .feedback{margin-top:16px;padding:14px 18px;border-radius:10px;font-size:.9rem;line-height:1.6;display:none;animation:fadeUp .3s ease}
  .feedback.show{display:block}
  .feedback.ok{background:rgba(16,185,129,.09);border:1px solid rgba(16,185,129,.25);color:var(--a1)}
  .feedback.err{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);color:var(--red)}
  .section-title{font-size:1.05rem;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:10px}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border)}
  .result-trophy{font-size:4rem;text-align:center;margin:10px 0 16px}
  .result-title{font-size:1.8rem;font-weight:800;text-align:center;margin-bottom:8px}
  .result-sub{text-align:center;color:var(--muted);margin-bottom:24px;font-size:.92rem}
  .result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:28px}
  .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 12px;text-align:center}
  .stat-box .sv{font-family:'Fira Mono',monospace;font-size:1.5rem;color:var(--a1)}
  .stat-box .sl{font-size:.75rem;color:var(--muted);margin-top:4px}
  .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(6,13,10,.3);border-top-color:#060d0a;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 20px;font-size:.88rem;z-index:9999;animation:slideIn .3s ease;max-width:300px}
  .toast.ok{border-color:var(--a1)}.toast.err{border-color:var(--red)}
  @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
  @media(max-width:520px){.card{padding:22px 16px}.result-stats{grid-template-columns:1fr 1fr}.tab-btn{font-size:.72rem;padding:9px 4px}.node-choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="badge">🌳 Semana 14 · Pensamiento Crítico · UVP</div>
    <h1>Árboles de Decisión<br>y Consecuencias</h1>
    <p>Nodos de decisión · Nodos de azar · Valor esperado</p>
  </div>

  <div class="tree-preview">
    <div class="tree-svg-wrap">
      <svg width="340" height="180" viewBox="0 0 340 180">
        <line x1="40" y1="90" x2="120" y2="50" stroke="#1a3828" stroke-width="1.5"/>
        <line x1="40" y1="90" x2="120" y2="130" stroke="#1a3828" stroke-width="1.5"/>
        <line x1="120" y1="50" x2="210" y2="25" stroke="#1a3828" stroke-width="1.5"/>
        <line x1="120" y1="50" x2="210" y2="75" stroke="#1a3828" stroke-width="1.5"/>
        <line x1="120" y1="130" x2="210" y2="105" stroke="#1a3828" stroke-width="1.5"/>
        <line x1="120" y1="130" x2="210" y2="155" stroke="#1a3828" stroke-width="1.5"/>
        <rect x="10" y="75" width="60" height="30" rx="4" class="node-dec"/>
        <text x="40" y="93" text-anchor="middle">Decisión</text>
        <circle cx="120" cy="50" r="18" class="node-cha"/>
        <text x="120" y="54" text-anchor="middle">Azar</text>
        <circle cx="120" cy="130" r="18" class="node-cha"/>
        <text x="120" y="134" text-anchor="middle">Azar</text>
        <rect x="195" y="12" width="55" height="26" rx="4" class="node-end"/>
        <text x="222" y="28" text-anchor="middle">+100</text>
        <rect x="195" y="62" width="55" height="26" rx="4" class="node-end"/>
        <text x="222" y="78" text-anchor="middle">-40</text>
        <rect x="195" y="92" width="55" height="26" rx="4" class="node-end"/>
        <text x="222" y="108" text-anchor="middle">+60</text>
        <rect x="195" y="142" width="55" height="26" rx="4" class="node-end"/>
        <text x="222" y="158" text-anchor="middle">0</text>
        <text x="74" y="44" class="branch-lbl">Alt A</text>
        <text x="74" y="126" class="branch-lbl">Alt B</text>
        <text x="148" y="22" class="branch-lbl">éxito</text>
        <text x="148" y="72" class="branch-lbl">falla</text>
        <text x="148" y="102" class="branch-lbl">éxito</text>
        <text x="148" y="152" class="branch-lbl">falla</text>
      </svg>
    </div>
    <div class="legend-row">
      <div class="legend-item"><div class="legend-box" style="background:#1a3828;border-color:#10b981"></div>Decisión □</div>
      <div class="legend-item"><div class="legend-box" style="background:#1a2038;border-color:#3b82f6;border-radius:50%"></div>Azar ○</div>
      <div class="legend-item"><div class="legend-box" style="background:#2d1a38;border-color:#8b5cf6"></div>Resultado ◇</div>
    </div>
  </div>

  <div id="screen-login" class="card">
    <div class="section-title">🎓 Identifícate</div>
    <div class="tabs">
      <button class="tab-btn active" data-plantel="Puebla" onclick="selectPlantel(this)">Puebla</button>
      <button class="tab-btn" data-plantel="Tehuacán" onclick="selectPlantel(this)">Tehuacán</button>
      <button class="tab-btn" data-plantel="Tlaxcala" onclick="selectPlantel(this)">Tlaxcala</button>
    </div>
    <div class="form-group"><label>Nombre completo</label><input type="text" id="inp-nombre" placeholder="Ej. Tomás Aguilar Pérez"/></div>
    <div class="form-group"><label>Matrícula</label><input type="text" id="inp-matricula" placeholder="Ej. 2023001234" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')" maxlength="12"/></div>
    <button class="btn btn-full" onclick="startGame()">Comenzar actividad →</button>
  </div>

  <div id="screen-game" class="hidden">
    <div class="xp-row"><span style="font-size:1.3rem">⚡</span><div class="xp-label">XP acumulados</div><div class="xp-val" id="xp-display">0 XP</div></div>
    <div class="streak-row"><span class="streak-star" id="st0">⭐</span><span class="streak-star" id="st1">⭐</span><span class="streak-star" id="st2">⭐</span><span class="streak-star" id="st3">⭐</span><span class="streak-star" id="st4">⭐</span><span class="streak-star" id="st5">⭐</span></div>
    <div class="levels-row" id="levels-row"></div>
    <div class="progress-wrap"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="progress-label"><span id="prog-label">Nivel 1 de 6</span><span id="prog-pct">0%</span></div>
    <div class="card" id="q-card">
      <div class="timer-wrap"><div class="timer-bar-bg"><div class="timer-bar-fill" id="timer-bar" style="width:100%"></div></div><div class="timer-num" id="timer-num">30</div></div>
      <div class="q-tag" id="q-tag">Nivel 1</div>
      <div id="q-body"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn btn-full hidden" id="btn-next" onclick="nextLevel()" style="margin-top:18px">Siguiente nivel →</button>
    </div>
  </div>

  <div id="screen-result" class="hidden card">
    <div class="result-trophy" id="result-trophy">🏆</div>
    <div class="result-title" id="result-title">¡Completado!</div>
    <div class="result-sub" id="result-sub"></div>
    <div class="result-stats">
      <div class="stat-box"><div class="sv" id="r-correct">0</div><div class="sl">Correctas</div></div>
      <div class="stat-box"><div class="sv" id="r-xp">0</div><div class="sl">XP ganados</div></div>
      <div class="stat-box"><div class="sv" id="r-time">0s</div><div class="sl">Tiempo</div></div>
    </div>
    <button class="btn btn-full btn-gold" id="btn-save" onclick="saveResult()"><span id="save-label">Guardar resultado</span></button>
    <div style="height:10px"></div>
    <button class="btn btn-full btn-outline" onclick="resetAll()">Reintentar actividad</button>
  </div>
</div>
<script>
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbzHrcAlYOVJ66BjFZygT6d2pG8kWdWjRsSSl06ESe3_qa4__yf1e98CVGor0cip2Yql/exec";
const LEVELS=[
  {id:1,tag:"Nivel 1 — Tipos de nodo",xp:50,time:28,type:"mcq",
   stem:"En un árbol de decisión, ¿qué representa un <strong>nodo de azar (círculo)</strong>?",
   opts:["Un punto donde el agente elige entre alternativas.","Un punto donde ocurre un evento fuera del control del agente, con probabilidades asociadas.","El resultado final numérico de una rama.","La raíz del árbol donde se inicia el proceso."],
   correct:1,
   fb_ok:"✅ Correcto. Los círculos son nodos de azar: representan eventos externos cuyas probabilidades no controla el agente. Los cuadrados son nodos de decisión (el agente elige).",
   fb_err:"El nodo de azar (círculo) = evento externo con probabilidades. El nodo de decisión (cuadrado) = el agente elige. Los resultados finales son las hojas del árbol."},
  {id:2,tag:"Nivel 2 — Calcula el VE",xp:80,time:35,type:"mcq",
   stem:"Una inversión tiene 60% de probabilidad de ganar $200 y 40% de probabilidad de perder $100.<br><br>¿Cuál es el <strong>Valor Esperado (VE)</strong> de esta inversión?",
   opts:["VE = $80","VE = $120","VE = $100","VE = $60"],
   correct:0,
   fb_ok:"✅ Correcto. VE = (0.60 × 200) + (0.40 × −100) = 120 − 40 = <strong>$80</strong>. El VE es el promedio ponderado por probabilidades de todos los resultados posibles.",
   fb_err:"VE = (p₁ × resultado₁) + (p₂ × resultado₂) = (0.6 × 200) + (0.4 × −100) = 120 − 40 = $80."},
  {id:3,tag:"Nivel 3 — Identifica el nodo",xp:80,time:28,type:"nodepicker",
   stem:"Para cada situación, identifica qué <strong>tipo de nodo</strong> la representa en un árbol de decisión:",
   cases:[
     {text:"El gerente debe elegir entre lanzar el producto ahora o esperar 6 meses.",correct:"dec"},
     {text:"Después de lanzar, el mercado puede crecer (70%) o contraerse (30%).",correct:"cha"},
     {text:"Si el mercado crece y se lanzó → ganancia de $500,000.",correct:"end"},
   ],
   fb_ok:"✅ ¡Correcto! Decisión del agente=cuadrado, evento aleatorio=círculo, resultado final=hoja (valor terminal).",
   fb_err:"Nodo de decisión □ = el agente elige. Nodo de azar ○ = evento externo con probabilidad. Nodo resultado = valor terminal de la rama."},
  {id:4,tag:"Nivel 4 — Elige la rama óptima",xp:110,time:32,type:"mcq",
   stem:"Dos alternativas de inversión:<br><em>Alt A:</em> 50% de ganar $300 y 50% de perder $100<br><em>Alt B:</em> 80% de ganar $150 y 20% de ganar $50<br><br>Usando el criterio de <strong>Valor Esperado máximo</strong>, ¿cuál elegirías?",
   opts:["Alt A — VE = $100","Alt B — VE = $130","Alt A — VE = $200","Alt B — VE = $100"],
   correct:1,
   fb_ok:"✅ Alt B tiene mayor VE. VE(A) = 0.5×300 + 0.5×(−100) = 150−50 = $100. VE(B) = 0.8×150 + 0.2×50 = 120+10 = $130. Elige Alt B.",
   fb_err:"VE(A)=(0.5×300)+(0.5×−100)=$100. VE(B)=(0.8×150)+(0.2×50)=$130. El criterio VE máximo elige Alt B con $130."},
  {id:5,tag:"Nivel 5 — Ordena la construcción",xp:150,time:38,type:"order",
   stem:"Ordena los pasos para construir un <strong>árbol de decisión</strong> correctamente:",
   items:[
     {text:"Identificar el punto de decisión inicial y dibujarlo como raíz (cuadrado).",order:1},
     {text:"Para cada alternativa, identificar los eventos inciertos y agregar nodos de azar (círculos).",order:2},
     {text:"Asignar probabilidades a cada rama de los nodos de azar (deben sumar 1).",order:3},
     {text:"Agregar los valores de resultado en las hojas terminales del árbol.",order:4},
     {text:"Calcular el VE de cada nodo de azar y retroceder (backward induction) para decidir.",order:5},
   ],
   fb_ok:"✅ ¡Orden correcto! Raíz→alternativas→nodos de azar con probabilidades→resultados→backward induction para decidir.",
   fb_err:"Orden: 1) raíz decisión, 2) nodos de azar por alternativa, 3) probabilidades que sumen 1, 4) valores terminales, 5) VE y backward induction."},
  {id:6,tag:"Nivel 6 — Peor escenario",xp:200,time:32,type:"mcq",
   stem:"Un emprendedor analiza:<br><em>Lanzar startup:</em> 30% → +$1,000,000 · 70% → −$200,000<br><em>Trabajo estable:</em> 100% → +$80,000<br><br>VE(startup) = $300,000−$140,000 = <strong>$160,000</strong>. VE(trabajo) = <strong>$80,000</strong>.<br><br>Aunque el VE favorece a la startup, ¿por qué podría ser <strong>racional</strong> elegir el trabajo estable?",
   opts:["El VE del trabajo es mayor, por lo que siempre es la mejor opción.","El agente puede ser averse al riesgo: el peor caso de la startup (−$200K) es inaceptable aunque el VE sea mejor.","El cálculo del VE de la startup es incorrecto.","El VE nunca debe usarse para decisiones personales."],
   correct:1,
   fb_ok:"✅ ¡Análisis correcto! El VE es solo uno de los criterios. Un agente averso al riesgo puede preferir un resultado seguro menor ($80K) sobre un mejor promedio con alta varianza (riesgo de −$200K). La teoría de la utilidad amplía la decisión racional.",
   fb_err:"El VE no captura todo. Un agente averso al riesgo da más peso al peor escenario posible. Perder $200K podría ser catastrófico para él, lo que hace racional preferir la certeza de $80K."}
];
let S={plantel:"Puebla",nombre:"",matricula:"",cur:0,xp:0,correct:0,startTime:null,timer:null,timeLeft:30,answered:false,_tt:0,orderDrag:null,nodeAnswers:{}};
function selectPlantel(b){document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.plantel=b.dataset.plantel}
function startGame(){
  const n=document.getElementById('inp-nombre').value.trim(),m=document.getElementById('inp-matricula').value.trim();
  if(!n){showToast("Escribe tu nombre","err");return}if(m.length<5){showToast("Matrícula inválida","err");return}
  S.nombre=n;S.matricula=m;S.cur=0;S.xp=0;S.correct=0;S.startTime=Date.now();
  show('screen-game');hide('screen-login');buildDots();loadLevel();
}
function buildDots(){const r=document.getElementById('levels-row');r.innerHTML='';LEVELS.forEach((_,i)=>{const d=document.createElement('div');d.className='level-dot'+(i===0?' active':'');d.id='dot-'+i;d.textContent=i+1;r.appendChild(d)})}
function loadLevel(){
  const lvl=LEVELS[S.cur];S.answered=false;S.orderDrag=null;S.nodeAnswers={};
  document.querySelectorAll('.level-dot').forEach((d,i)=>{d.className='level-dot'+(i<S.cur?' done':'')+(i===S.cur?' active':'');d.textContent=i<S.cur?'✓':i+1});
  const pct=Math.round((S.cur/LEVELS.length)*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=`Nivel ${S.cur+1} de ${LEVELS.length}`;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('q-tag').textContent=lvl.tag;
  const fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';
  document.getElementById('btn-next').classList.add('hidden');
  const body=document.getElementById('q-body');body.innerHTML='';
  ({mcq:renderMCQ,tf:renderTF,nodepicker:renderNodePicker,order:renderOrder})[lvl.type](lvl,body);
  startTimer(lvl.time);
}
function renderMCQ(lvl,body){
  body.innerHTML=`<div class="q-stem">${lvl.stem}</div><div class="options" id="opts"></div>`;
  ['A','B','C','D'].forEach((l,i)=>{const b=document.createElement('button');b.className='opt-btn';b.innerHTML=`<span class="opt-letter">${l}</span><span>${lvl.opts[i]}</span>`;b.onclick=()=>answerMCQ(i,lvl);body.querySelector('#opts').appendChild(b)});
}
function answerMCQ(idx,lvl){
  if(S.answered)return;S.answered=true;clearInterval(S.timer);
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{b.disabled=true;if(i===lvl.correct)b.classList.add('correct');else if(i===idx)b.classList.add('wrong')});
  if(idx===lvl.correct)earnXP(lvl);else showFeedback(false,lvl.fb_err);
  document.getElementById('btn-next').classList.remove('hidden');
}
function renderTF(lvl,body){body.innerHTML=`<div class="q-stem">${lvl.stem}</div><div class="tf-row"><button class="tf-chip" id="chip-t" onclick="answerTF(true)">✓ Verdadero</button><button class="tf-chip" id="chip-f" onclick="answerTF(false)">✗ Falso</button></div>`}
function answerTF(val){
  if(S.answered)return;S.answered=true;clearInterval(S.timer);
  const lvl=LEVELS[S.cur];const ok=val===lvl.correct;
  const bt=document.getElementById('chip-t'),bf=document.getElementById('chip-f');bt.disabled=bf.disabled=true;(val?bt:bf).classList.add(ok?'correct-chip':'wrong-chip');
  if(ok)earnXP(lvl);else showFeedback(false,lvl.fb_err);document.getElementById('btn-next').classList.remove('hidden');
}
function renderNodePicker(lvl,body){
  let html=`<div class="q-stem">${lvl.stem}</div>`;
  lvl.cases.forEach((c,i)=>{
    html+=`<div class="tree-case"><strong>Caso ${i+1}:</strong> ${c.text}</div>
    <div class="node-choices" style="margin-bottom:18px">
      <button class="nc-btn dec" data-case="${i}" data-val="dec" onclick="answerNode(this)">□ Decisión</button>
      <button class="nc-btn cha" data-case="${i}" data-val="cha" onclick="answerNode(this)">○ Azar</button>
      <button class="nc-btn end" data-case="${i}" data-val="end" onclick="answerNode(this)">◇ Resultado</button>
    </div>`;
  });
  html+=`<button class="btn btn-full btn-blue" id="btn-node" onclick="checkNodePicker()">Verificar ✓</button>`;
  body.innerHTML=html;
}
function answerNode(btn){
  if(S.answered)return;
  const ci=btn.dataset.case;
  document.querySelectorAll(`.nc-btn[data-case="${ci}"]`).forEach(b=>{b.style.opacity='0.4';b.style.background=''});
  btn.style.opacity='1';btn.style.background='rgba(245,158,11,.1)';btn.style.borderColor='var(--gold)';
  S.nodeAnswers[ci]=btn.dataset.val;
}
function checkNodePicker(){
  if(S.answered)return;S.answered=true;clearInterval(S.timer);
  const lvl=LEVELS[S.cur];let ok=true;
  lvl.cases.forEach((c,i)=>{
    const chosen=S.nodeAnswers[i];const correct=c.correct;
    document.querySelectorAll(`.nc-btn[data-case="${i}"]`).forEach(b=>{
      b.disabled=true;b.style.opacity='1';b.style.background='';b.style.borderColor='';
      if(b.dataset.val===correct)b.classList.add('correct-nc');
      else if(b.dataset.val===chosen&&chosen!==correct)b.classList.add('wrong-nc');
    });
    if(chosen!==correct)ok=false;
  });
  document.getElementById('btn-node').disabled=true;
  if(ok)earnXP(lvl);else showFeedback(false,lvl.fb_err);
  document.getElementById('btn-next').classList.remove('hidden');
}
function renderOrder(lvl,body){
  const shuffled=[...lvl.items].sort(()=>Math.random()-.5);
  body.innerHTML=`<div class="q-stem">${lvl.stem}</div><div class="sort-list" id="slist"></div>
  <button class="btn btn-full btn-blue" id="btn-chk" onclick="checkOrder()">Verificar orden ✓</button>`;
  const list=body.querySelector('#slist');
  shuffled.forEach((item,i)=>{
    const d=document.createElement('div');d.className='sort-item';d.dataset.order=item.order;d.draggable=true;
    d.innerHTML=`<span class="drag-handle">⠿</span><span class="step-num">#${i+1}</span><span>${item.text}</span>`;
    d.addEventListener('dragstart',e=>{S.orderDrag=d;d.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    d.addEventListener('dragend',()=>{d.classList.remove('dragging');S.orderDrag=null});
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('drag-over')});
    d.addEventListener('dragleave',()=>d.classList.remove('drag-over'));
    d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('drag-over');if(S.orderDrag&&S.orderDrag!==d){const its=[...list.children];const a=its.indexOf(S.orderDrag),b=its.indexOf(d);if(a<b)list.insertBefore(S.orderDrag,d.nextSibling);else list.insertBefore(S.orderDrag,d);[...list.children].forEach((el,i)=>el.querySelector('.step-num').textContent='#'+(i+1))}});
    list.appendChild(d);
  });
}
function checkOrder(){
  if(S.answered)return;S.answered=true;clearInterval(S.timer);
  const lvl=LEVELS[S.cur];const list=document.getElementById('slist');let ok=true;
  [...list.children].forEach((el,i)=>{const c=parseInt(el.dataset.order)===i+1;if(!c)ok=false;el.style.borderColor=c?'var(--a1)':'var(--red)';el.style.background=c?'rgba(16,185,129,.07)':'rgba(239,68,68,.07)'});
  document.getElementById('btn-chk').disabled=true;
  if(ok)earnXP(lvl);else showFeedback(false,lvl.fb_err);document.getElementById('btn-next').classList.remove('hidden');
}
function startTimer(sec){
  clearInterval(S.timer);S.timeLeft=sec;const bar=document.getElementById('timer-bar'),num=document.getElementById('timer-num');
  bar.className='timer-bar-fill';num.className='timer-num';bar.style.width='100%';num.textContent=sec;
  S.timer=setInterval(()=>{S.timeLeft--;bar.style.width=(S.timeLeft/sec*100)+'%';num.textContent=S.timeLeft;if(S.timeLeft<=8){bar.className='timer-bar-fill danger';num.className='timer-num danger'}if(S.timeLeft<=0){clearInterval(S.timer);if(!S.answered)timeOut()}},1000);
}
function timeOut(){
  if(S.answered)return;S.answered=true;const lvl=LEVELS[S.cur];
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{b.disabled=true;if(i===lvl.correct)b.classList.add('correct')});
  ['btn-node','btn-chk'].forEach(id=>{const e=document.getElementById(id);if(e)e.disabled=true});
  showFeedback(false,'⏱ ¡Tiempo agotado! '+lvl.fb_err);document.getElementById('btn-next').classList.remove('hidden');
}
function earnXP(lvl){const b=Math.round((S.timeLeft/lvl.time)*50);S.xp+=lvl.xp+b;S.correct+=1;document.getElementById('st'+S.cur).classList.add('lit');document.getElementById('xp-display').textContent=S.xp+' XP';showFeedback(true,lvl.fb_ok+(b?` <em>+${b} XP ⚡</em>`:'')); }
function showFeedback(ok,msg){const fb=document.getElementById('feedback');fb.className='feedback show '+(ok?'ok':'err');fb.innerHTML=msg}
function nextLevel(){S.cur++;if(S.cur>=LEVELS.length)showResult();else loadLevel()}
function showResult(){
  hide('screen-game');show('screen-result');const tt=Math.round((Date.now()-S.startTime)/1000);S._tt=tt;const pct=Math.round((S.correct/LEVELS.length)*100);
  let trophy='🥉',title='¡Completado!',sub='Repasa los nodos y el cálculo de Valor Esperado.';
  if(pct>=83){trophy='🏆';title='¡Maestro de árboles!';sub='Trazas árboles perfectos. ¡Semana 15!';}
  else if(pct>=60){trophy='🥈',title='¡Buen análisis!';sub='Practica más el cálculo del VE y la backward induction.';}
  document.getElementById('result-trophy').textContent=trophy;document.getElementById('result-title').textContent=title;document.getElementById('result-sub').textContent=sub;
  document.getElementById('r-correct').textContent=`${S.correct}/6`;document.getElementById('r-xp').textContent=S.xp;document.getElementById('r-time').textContent=tt+'s';
}
async function saveResult(){
  const btn=document.getElementById('btn-save'),lbl=document.getElementById('save-label');btn.disabled=true;lbl.innerHTML='<span class="spinner"></span> Guardando...';
  const p={plantel:S.plantel,matricula:S.matricula,nombre:S.nombre,semana:14,tema:"Árboles de Decisión y Consecuencias",correctas:S.correct,total:LEVELS.length,xp:S.xp,porcentaje:Math.round((S.correct/LEVELS.length)*100),tiempoTotal:S._tt,fecha:new Date().toLocaleString('es-MX',{timeZone:'America/Mexico_City'})};
  try{await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});showToast('✅ Guardado','ok');lbl.textContent='✓ Guardado';}
  catch(e){showToast('❌ Error','err');btn.disabled=false;lbl.textContent='Reintentar';}
}
function resetAll(){hide('screen-result');hide('screen-game');show('screen-login');for(let i=0;i<6;i++)document.getElementById('st'+i).classList.remove('lit');document.getElementById('xp-display').textContent='0 XP'}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function showToast(msg,type){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
</script>
</body>
</html>
